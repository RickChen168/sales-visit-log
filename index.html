<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>業務追蹤記錄</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: field notebook — one column form, a tracker ledger with summary strip, filters, expandable rows */
:root{
  --bg:#f5f7f6; --surface:#ffffff; --ink:#17201f; --muted:#5d6b69; --line:#d9e0de;
  --accent:#0d5e5a; --accent-ink:#ffffff; --accent-soft:#e1efed;
  --warn:#9a5b00; --warn-soft:#fbefd9; --bad:#a3332b; --bad-soft:#f8e2df; --ok:#2f6b2f; --ok-soft:#e3f0e0;
  --f-display:"Noto Serif TC","Songti TC",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111716; --surface:#19211f; --ink:#e6ecea; --muted:#9aa9a6; --line:#2c3735;
  --accent:#5fc0b8; --accent-ink:#0b1514; --accent-soft:#1d3532;
  --warn:#e6b25c; --warn-soft:#3a2d16; --bad:#ec8c83; --bad-soft:#3c1f1c; --ok:#8fcf87; --ok-soft:#1e3320; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111716; --surface:#19211f; --ink:#e6ecea; --muted:#9aa9a6; --line:#2c3735;
  --accent:#5fc0b8; --accent-ink:#0b1514; --accent-soft:#1d3532;
  --warn:#e6b25c; --warn-soft:#3a2d16; --bad:#ec8c83; --bad-soft:#3c1f1c; --ok:#8fcf87; --ok-soft:#1e3320; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;padding:0 16px;padding-block:24px 64px}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--f-display);font-size:28px;margin:0;line-height:1.2;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin:4px 0 0}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px}
.tabs button{border:0;background:none;color:var(--muted);font:inherit;font-weight:500;padding:8px 16px;border-radius:7px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.tabs .count{font-family:var(--f-mono);font-size:12px;margin-left:6px;opacity:.8}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.notice{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 16px;font-size:14px;color:var(--muted)}
.notice.err{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}

/* form */
form{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:24px}
fieldset{border:0;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px 18px}
legend{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--accent);padding:0 0 10px;text-transform:uppercase}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f.wide{grid-column:1/-1}
label{font-size:13px;font-weight:500}
label .req{color:var(--bad);margin-left:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
textarea{min-height:84px;resize:vertical}
.hint{font-size:12px;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:400;background:var(--bg)}
.seg input{width:auto;margin:0;accent-color:var(--accent)}
.seg label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.btn{font:inherit;font-weight:500;border-radius:8px;padding:10px 20px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:5px 12px;font-size:13px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.toast{font-size:14px;color:var(--ok)}
.toast.err{color:var(--bad)}

/* tracker */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-family:var(--f-mono);font-size:24px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.3}
.stat.alert .v{color:var(--bad)}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.filters .f{flex:1 1 140px}
.filters .f.q{flex:2 1 220px}
.tablebox{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:860px}
th{text-align:left;font-size:12px;font-weight:500;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--accent-soft)}
tr.row.open td{background:var(--accent-soft)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap}
.co{font-weight:700}
.co small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;background:var(--bg);border:1px solid var(--line);white-space:nowrap}
.pill.s1{background:var(--accent-soft);border-color:transparent}
.pill.s2{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.pill.won{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.lost{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.due{color:var(--bad);font-weight:500}
.soon{color:var(--warn)}
td select{padding:4px 8px;font-size:13px;width:auto;background:var(--surface)}
tr.detail td{background:var(--bg);padding:16px 18px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px 24px}
.dgrid div{min-width:0}
.dgrid h4{margin:0 0 2px;font-size:12px;color:var(--muted);font-weight:500}
.dgrid p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.drow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px;font-size:12px;color:var(--muted)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.login{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:32px 24px;display:flex;flex-direction:column;align-items:flex-start;gap:14px;max-width:520px}
.login h2{margin:0;font-family:var(--f-display);font-size:20px}
.login p{margin:0;color:var(--muted)}
.who{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.who strong{color:var(--ink);font-weight:500}
.who .pill{background:var(--accent-soft);border-color:transparent;color:var(--ink)}
.filler{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;font-size:14px;background:var(--accent-soft);border-radius:8px;padding:10px 14px}
.filler span{color:var(--muted);font-size:13px}
td.mine-mark{width:6px;padding:0}
</style>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>業務追蹤記錄</h1>
      <p class="sub" id="today"></p>
    </div>
    <div class="who" id="who" hidden>
      <span>已登入：<strong id="whoName"></strong></span>
      <span class="pill" id="whoRole"></span>
      <button class="btn sm" type="button" id="logoutBtn">登出</button>
    </div>
  </header>

  <div class="notice" id="status" hidden></div>

  <!-- LOGIN -->
  <section id="pane-login" class="login">
    <h2>請用 Google 帳號登入</h2>
    <p>登入後才能填寫出訪記錄、查詢記錄清單。帳號需要先由管理者加入名單。</p>
    <div id="gsiBtn"></div>
  </section>

  <!-- APP -->
  <div id="app" hidden>
    <div class="tabs" role="tablist" style="align-self:flex-start">
      <button role="tab" id="tab-form" aria-selected="true" aria-controls="pane-form">填寫記錄</button>
      <button role="tab" id="tab-list" aria-selected="false" aria-controls="pane-list">記錄清單<span class="count" id="tabCount"></span></button>
    </div>

    <section id="pane-form" role="tabpanel" aria-labelledby="tab-form" style="margin-top:16px">
      <form id="visitForm" novalidate>
        <fieldset>
          <legend>基本資訊</legend>
          <div class="f wide"><div class="filler"><span>填寫人</span><strong id="fillName"></strong><span id="fillRole"></span><span id="fillEmail"></span></div></div>
          <div class="f"><label for="visitDate">出訪日期<span class="req">*</span></label><input id="visitDate" type="date" required></div>
          <div class="f"><label>會議形式</label>
            <div class="seg" id="modeSeg">
              <label><input type="radio" name="mode" id="mode-1" value="實體拜訪" checked>實體拜訪</label>
              <label><input type="radio" name="mode" id="mode-2" value="線上會議">線上會議</label>
              <label><input type="radio" name="mode" id="mode-3" value="電話">電話</label>
            </div>
          </div>
        </fieldset>
      <fieldset>
        <legend>客戶</legend>
        <div class="f"><label for="company">客戶公司<span class="req">*</span></label><input id="company" required placeholder="公司全名或常用簡稱"></div>
        <div class="f"><label for="contact">拜訪對象</label><input id="contact" placeholder="姓名"></div>
        <div class="f"><label for="title">職稱 / 部門</label><input id="title" placeholder="例：IT 處長"></div>
        <div class="f"><label for="industry">產業別</label>
          <select id="industry"><option value="">—</option><option>製造業</option><option>金融保險</option><option>零售 / 電商</option><option>科技 / 半導體</option><option>醫療 / 生技</option><option>政府 / 公部門</option><option>服務業</option><option>其他</option></select></div>
      </fieldset>

      <fieldset>
        <legend>會議內容</legend>
        <div class="f wide"><label for="summary">會議重點<span class="req">*</span></label><textarea id="summary" required placeholder="討論了什麼、客戶的反應、提到的競品…"></textarea></div>
        <div class="f wide"><label for="needs">客戶需求 / 痛點</label><textarea id="needs" placeholder="例：客服人力不足，希望導入 AI Agent 處理 Tier-1 問題"></textarea></div>
      </fieldset>

      <fieldset>
        <legend>商機與跟進</legend>
        <div class="f"><label for="stage">商機階段<span class="req">*</span></label>
          <select id="stage" required>
            <option value="">請選擇</option><option>初次接觸</option><option>需求確認</option><option>提案 / 報價</option><option>POC 中</option><option>議價 / 簽約</option><option>成交</option><option>暫停 / 流失</option>
          </select></div>
        <div class="f"><label for="amount">預估金額（新台幣）</label><input id="amount" type="number" min="0" step="10000" inputmode="numeric" placeholder="例：1200000"></div>
        <div class="f"><label for="nextDate">下次跟進日期</label><input id="nextDate" type="date"></div>
        <div class="f wide"><label for="nextAction">下一步行動</label><input id="nextAction" placeholder="例：週五前寄送報價單與案例簡報"></div>
      </fieldset>
        <div class="actions">
          <button class="btn primary" type="submit" id="submitBtn">送出記錄</button>
          <button class="btn" type="button" id="resetBtn">清空</button>
          <span class="toast" id="toast" role="status"></span>
        </div>
      </form>
    </section>

    <section id="pane-list" role="tabpanel" aria-labelledby="tab-list" hidden style="margin-top:16px">
      <div class="wrap" style="gap:16px">
        <div class="stats">
          <div class="stat"><div class="k" id="stCountLabel">記錄筆數</div><div class="v" id="stCount">0</div></div>
          <div class="stat"><div class="k">本月出訪</div><div class="v" id="stMonth">0</div></div>
          <div class="stat" id="stDueBox"><div class="k">已到期待跟進</div><div class="v" id="stDue">0</div></div>
          <div class="stat"><div class="k">進行中商機預估金額</div><div class="v" id="stPipe">0</div></div>
        </div>

        <div class="filters">
          <div class="f q"><label for="q">搜尋</label><input id="q" type="search" placeholder="公司、聯絡人、內容關鍵字"></div>
          <div class="f" id="fRepBox" hidden><label for="fRep">業務</label><select id="fRep"><option value="">全部業務</option></select></div>
          <div class="f" id="fRoleBox" hidden><label for="fRole">身份別</label><select id="fRole"><option value="">全部</option><option>睿思智慧</option><option>經銷商</option></select></div>
          <div class="f"><label for="fStage">商機階段</label><select id="fStage"><option value="">全部</option><option>初次接觸</option><option>需求確認</option><option>提案 / 報價</option><option>POC 中</option><option>議價 / 簽約</option><option>成交</option><option>暫停 / 流失</option></select></div>
          <div class="f"><label for="fRange">期間</label><select id="fRange"><option value="">全部</option><option value="week">本週</option><option value="month">本月</option><option value="due">已到期待跟進</option></select></div>
        </div>

        <div class="bar"><span id="resultCount"></span><button class="btn sm" type="button" id="refreshBtn">重新整理</button></div>

        <div class="tablebox">
          <table>
            <thead><tr><th>出訪日期</th><th>業務</th><th>客戶</th><th>商機階段</th><th style="text-align:right">預估金額</th><th>下次跟進</th><th>跟進狀態</th></tr></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </div>
    </section>
  </div>
</div>

<script>
/* ===== 設定 ===== */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxVK63k8FkfJiuT4fmzechyJKzq-c1PbCl-nzzHjbHpg61J56bPfVKz5Xxku0GsuwdS/exec";
const GOOGLE_CLIENT_ID = "90510015361-i0j9rj46coik3bepqsdburikqs4qvkfi.apps.googleusercontent.com";   // Google Cloud「OAuth 用戶端 ID」，與 Code.gs 的 CLIENT_ID 相同
/* =============== */
(function(){
  const $ = id => document.getElementById(id);
  const tz = "Asia/Taipei";
  const ymd = d => new Intl.DateTimeFormat("en-CA",{timeZone:tz,year:"numeric",month:"2-digit",day:"2-digit"}).format(d);
  const todayStr = () => ymd(new Date());
  const wk="日一二三四五六";
  $("today").textContent = "今天 " + todayStr().replace(/-/g,"/") + "（" + wk[new Date(todayStr()+"T00:00:00").getDay()] + "）";
  function weekStart(){ const t=new Date(todayStr()+"T00:00:00"); const dow=(t.getDay()+6)%7; t.setDate(t.getDate()-dow); return ymd(t); }
  const normDate = s => { s=String(s||"").trim(); const m=s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/); return m? m[1]+"-"+m[2].padStart(2,"0")+"-"+m[3].padStart(2,"0") : s; };

  function ssGet(k){ try{return sessionStorage.getItem(k)||""}catch(e){return ""} }
  function ssSet(k,v){ try{ v? sessionStorage.setItem(k,v) : sessionStorage.removeItem(k);}catch(e){} }

  function setStatus(msg,err){ const s=$("status"); if(!msg){s.hidden=true;return} s.hidden=false; s.textContent=msg; s.className="notice"+(err?" err":""); }

  let token = "", user = null, records = [], openRow = null;

  /* ---------- 登入 ---------- */
  function jwtExp(t){ try{ const p=JSON.parse(decodeURIComponent(escape(atob(t.split(".")[1].replace(/-/g,"+").replace(/_/g,"/"))))); return (p.exp||0)*1000; }catch(e){ return 0; } }

  async function api(action, extra){
    const res = await fetch(SCRIPT_URL, { method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify(Object.assign({action, idToken: token}, extra||{})) });
    const out = await res.json().catch(()=>null);
    if(!out) throw {error:"bad_response"};
    if(!out.ok) throw out;
    return out;
  }

  const ERR = {
    not_allowed: e => "這個帳號（"+(e.email||"")+"）還沒有使用權限，請聯絡管理者把你加入名單。",
    auth_expired: () => "登入已過期，請重新登入。",
    auth_invalid: () => "登入驗證失敗，請重新登入。",
    auth_required: () => "請先登入。",
    missing_client_id: () => "系統尚未完成登入設定（缺少 OAuth 用戶端 ID），請聯絡管理者。",
  };
  function errMsg(e){ return (ERR[e&&e.error]||(()=>"連線失敗，請稍後再試。"))(e||{}); }

  async function onToken(t){
    token = t; ssSet("idToken", t);
    setStatus("驗證帳號中…");
    try{
      const out = await api("me");
      user = out.user; setStatus("");
      enterApp();
    }catch(e){
      signOut(true);
      setStatus(errMsg(e), true);
    }
  }

  function signOut(keepMsg){
    token=""; user=null; records=[]; ssSet("idToken","");
    try{ google.accounts.id.disableAutoSelect(); }catch(e){}
    $("app").hidden=true; $("who").hidden=true; $("pane-login").hidden=false;
    if(!keepMsg) setStatus("");
  }
  $("logoutBtn").onclick=()=>signOut();

  function initGsi(){
    if(!GOOGLE_CLIENT_ID){ setStatus("系統尚未完成登入設定（缺少 OAuth 用戶端 ID），請聯絡管理者。", true); return; }
    if(!(window.google && google.accounts && google.accounts.id)){ setTimeout(initGsi, 200); return; }
    google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: r => onToken(r.credential), auto_select: true });
    google.accounts.id.renderButton($("gsiBtn"), { theme:"outline", size:"large", text:"signin_with", locale:"zh-TW" });
    const saved = ssGet("idToken");
    if(saved && jwtExp(saved) > Date.now()+60000) onToken(saved);
    else google.accounts.id.prompt();
  }

  function enterApp(){
    $("pane-login").hidden=true; $("app").hidden=false; $("who").hidden=false;
    $("whoName").textContent = user.name; $("whoRole").textContent = user.role;
    $("fillName").textContent = user.name; $("fillRole").textContent = user.role; $("fillEmail").textContent = user.email;
    $("fRepBox").hidden = !user.canSeeAll; $("fRoleBox").hidden = !user.canSeeAll;
    $("stCountLabel").textContent = user.canSeeAll ? "全部記錄筆數" : "我的記錄筆數";
    loadList();
  }

  function needRelogin(e){ if(e && /^auth_/.test(e.error)){ signOut(true); setStatus(errMsg(e), true); return true; } return false; }

  /* ---------- 分頁 ---------- */
  function show(which){
    const f = which==="form";
    $("tab-form").setAttribute("aria-selected",f); $("tab-list").setAttribute("aria-selected",!f);
    $("pane-form").hidden=!f; $("pane-list").hidden=f;
    if(!f) loadList();
  }
  $("tab-form").onclick=()=>show("form");
  $("tab-list").onclick=()=>show("list");

  /* ---------- 填寫 ---------- */
  $("visitDate").value = todayStr();
  const val = id => $(id).value.trim();
  const radio = n => (document.querySelector('input[name="'+n+'"]:checked')||{}).value||"";
  function clearForm(){ ["company","contact","title","summary","needs","amount","nextDate","nextAction"].forEach(i=>$(i).value=""); $("stage").value=""; $("industry").value=""; $("mode-1").checked=true; }
  $("resetBtn").onclick=()=>{ clearForm(); $("toast").textContent=""; };

  $("visitForm").addEventListener("submit", async e=>{
    e.preventDefault();
    const t=$("toast"); t.className="toast";
    const missing=[["visitDate","出訪日期"],["company","客戶公司"],["summary","會議重點"],["stage","商機階段"]].filter(([i])=>!val(i)).map(([,n])=>n);
    if(missing.length){ t.className="toast err"; t.textContent="請填寫："+missing.join("、"); return; }
    const stage=val("stage");
    const record = {
      visitDate: val("visitDate"), mode: radio("mode"),
      company: val("company"), contact: val("contact"), title: val("title"), industry: val("industry"),
      summary: val("summary"), needs: val("needs"), stage: stage, amount: val("amount"),
      nextAction: val("nextAction"), nextDate: val("nextDate"),
      status: (stage==="成交"||stage==="暫停 / 流失") ? "已完成" : "待跟進"
    };
    const btn=$("submitBtn"); btn.disabled=true; t.textContent="送出中…";
    try{
      await api("submit", {record});
      clearForm();
      t.textContent = "已送出：" + record.company + "，已寫入追蹤清單。";
      records = null;
    }catch(err){
      if(needRelogin(err)) return;
      t.className="toast err";
      t.textContent = "送出失敗，資料沒有寫入。" + errMsg(err) + " 內容仍保留在表單中。";
    }finally{ btn.disabled=false; }
  });

  /* ---------- 記錄清單 ---------- */
  let loading=false;
  async function loadList(force){
    if(loading) return;
    if(records && records.length && !force) { render(); return; }
    loading=true; $("resultCount").textContent="載入中…";
    try{
      const out = await api("list");
      records = out.records.map(r=>Object.assign(r,{visitDate:normDate(r.visitDate), nextDate:normDate(r.nextDate)}));
      render();
    }catch(err){
      if(!needRelogin(err)) $("resultCount").textContent = "清單載入失敗：" + errMsg(err);
    }finally{ loading=false; }
  }
  $("refreshBtn").onclick=()=>loadList(true);
  ["q","fRep","fRole","fStage","fRange"].forEach(id=>$(id).addEventListener("input",render));

  const ACTIVE = ["初次接觸","需求確認","提案 / 報價","POC 中","議價 / 簽約"];
  const isDue = x => x.nextDate && x.status!=="已完成" && x.nextDate<=todayStr();
  function pillClass(s){ if(s==="成交")return"pill won"; if(s==="暫停 / 流失")return"pill lost"; if(s==="議價 / 簽約"||s==="POC 中")return"pill s2"; if(s==="提案 / 報價"||s==="需求確認")return"pill s1"; return"pill"; }
  function el(tag,cls,text){ const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }
  const short = n => n>=1e8 ? (n/1e8).toFixed(1).replace(/\.0$/,"")+" 億" : n>=1e4 ? Math.round(n/1e4).toLocaleString("zh-TW")+" 萬" : String(n);
  const num = v => Number(String(v||"").replace(/[^\d.]/g,""))||0;

  function filtered(){
    const q=val("q").toLowerCase(), r=$("fRep").value, ro=$("fRole").value, s=$("fStage").value, rg=$("fRange").value;
    const td=todayStr(), ws=weekStart(), ms=td.slice(0,7);
    return (records||[]).filter(x=>{
      if(r && x.rep!==r) return false;
      if(ro && x.role!==ro) return false;
      if(s && x.stage!==s) return false;
      if(rg==="week" && x.visitDate<ws) return false;
      if(rg==="month" && (x.visitDate||"").slice(0,7)!==ms) return false;
      if(rg==="due" && !isDue(x)) return false;
      if(q){ const hay=[x.company,x.contact,x.title,x.summary,x.needs,x.nextAction,x.rep].join(" ").toLowerCase(); if(!hay.includes(q)) return false; }
      return true;
    });
  }

  function render(){
    const all = records||[];
    const reps=[...new Set(all.map(x=>x.rep).filter(Boolean))].sort();
    const fr=$("fRep"), cur=fr.value; fr.length=1; reps.forEach(n=>{const o=el("option",null,n); o.value=n; fr.appendChild(o);}); fr.value=reps.includes(cur)?cur:"";

    const list = filtered();
    $("tabCount").textContent = all.length || "";
    $("stCount").textContent = list.length;
    $("stMonth").textContent = list.filter(x=>(x.visitDate||"").slice(0,7)===todayStr().slice(0,7)).length;
    const due=list.filter(isDue).length; $("stDue").textContent=due; $("stDueBox").classList.toggle("alert",due>0);
    const latest={}; list.forEach(x=>{ const k=x.company; if(!latest[k] || x.visitDate>latest[k].visitDate) latest[k]=x; });
    const pipe=Object.values(latest).filter(x=>ACTIVE.includes(x.stage)).reduce((a,x)=>a+num(x.amount),0);
    $("stPipe").textContent = pipe? short(pipe) : "0";
    $("resultCount").textContent = all.length ? `顯示 ${list.length} / ${all.length} 筆` + (user && !user.canSeeAll ? "（只顯示你自己的記錄）" : "") : "";

    const tb=$("tbody"); tb.textContent="";
    if(!list.length){
      const tr=el("tr"), c=el("td","empty"); c.colSpan=7;
      if(all.length) c.append(el("strong",null,"沒有符合條件的記錄"),"調整上方的搜尋或篩選條件看看。");
      else c.append(el("strong",null,"還沒有記錄"),"在「填寫記錄」送出第一筆後，就會出現在這裡。");
      tr.append(c); tb.append(tr); return;
    }
    list.forEach(x=>{
      const tr=el("tr","row"+(openRow===x.row?" open":"")); tr.tabIndex=0;
      tr.append(el("td","mono",(x.visitDate||"").replace(/-/g,"/")));
      const rc=el("td","co",x.rep||"—"); rc.style.fontWeight="400"; if(x.role) rc.append(el("small",null,x.role)); tr.append(rc);
      const co=el("td","co",x.company); if(x.contact||x.title) co.append(el("small",null,[x.contact,x.title].filter(Boolean).join(" · "))); tr.append(co);
      const sp=el("td"); sp.append(el("span",pillClass(x.stage),x.stage||"—")); tr.append(sp);
      const am=el("td","mono",x.amount? num(x.amount).toLocaleString("zh-TW"):"—"); am.style.textAlign="right"; tr.append(am);
      tr.append(el("td","mono"+(isDue(x)?" due":""), x.nextDate? x.nextDate.replace(/-/g,"/")+(isDue(x)?" 到期":"") : "—"));
      tr.append(el("td",null,x.status||"—"));
      const toggle=()=>{ openRow = openRow===x.row? null : x.row; render(); };
      tr.addEventListener("click",toggle);
      tr.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); toggle(); } });
      tb.append(tr);
      if(openRow===x.row){
        const dr=el("tr","detail"), dc=el("td"); dc.colSpan=7;
        const g=el("div","dgrid");
        [["會議重點",x.summary],["客戶需求 / 痛點",x.needs],["下一步行動",x.nextAction],["會議形式",x.mode],["產業別",x.industry]].forEach(([h,v])=>{ if(!v) return; const d=el("div"); d.append(el("h4",null,h), el("p",null,v)); g.append(d); });
        dc.append(g);
        dc.append(el("div","drow","送出時間 "+(x.__ts||"—")));
        dr.append(dc); tb.append(dr);
      }
    });
  }

  initGsi();
})();
</script>
</body>
</html>
